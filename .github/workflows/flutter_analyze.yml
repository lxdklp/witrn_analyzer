name: Flutter 分析与测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
    FLUTTER_VERSION: '3.47.7'

jobs:
  analyze:
    name: 运行 Flutter 分析与测试
    runs-on: ubuntu-slim
    steps:
      - name: 签出代码
        uses: actions/checkout@v6

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 运行分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test
